<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forred Studio — Indie Game Dev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .description {
            font-size: 1rem;
            color: #d1d5db;
            margin-bottom: 35px;
            line-height: 1.6;
            text-align: left;
            background: #1f2937;
            padding: 20px;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FORRED STUDIO</h1>
        <div class="tagline">Independent Game Development</div>
        <div class="description">
            Independent indie game dev studio creating atmospheric narrative games. Currently developing a post-apocalyptic retro-futuristic survival thriller set in the ruins of Moscow.
        </div>
        <a href="https://dtf.ru" class="link-btn btn" target="_blank">Наш DTF / Блог</a>
    </div>
</body>
</html>
